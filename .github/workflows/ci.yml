name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # check = unit + interaction tests and lint. Plus screenshot diffs, the catalog app,
      # and the same publish step JitPack runs, so a broken release fails here first.
      - run: ./gradlew check :yumi-components:verifyRoborazziDebug :catalog:assembleDebug publishToMavenLocal

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches catalog version
        run: |
          catalog=$(sed -n 's/^yumi = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ "$catalog" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match yumi = \"$catalog\" in gradle/libs.versions.toml"
            exit 1
          fi
      - name: Refuse snapshots
        run: |
          if grep -q '^yumi = ".*SNAPSHOT' gradle/libs.versions.toml; then
            echo "::error::Cannot release a SNAPSHOT version"; exit 1
          fi
      # JitPack builds on first request; ask now so the first user doesn't wait for it.
      - name: Warm up JitPack
        run: |
          curl -sS --max-time 900 -o /dev/null -w "JitPack build log: HTTP %{http_code}\n" \
            "https://jitpack.io/com/github/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/build.log" || true
