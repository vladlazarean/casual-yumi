<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" role="img" aria-label="Casual Yumi parts diagram: a TV remote whose keys are Compose components">
<defs>
  <filter id="raise" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
  <filter id="lift" x="-40%" y="-10%" width="180%" height="125%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
  <filter id="inset" x="-10%" y="-10%" width="120%" height="120%">
    <feOffset dy="3" in="SourceAlpha" result="o"/><feGaussianBlur in="o" stdDeviation="5" result="b"/>
    <feComposite in="SourceAlpha" in2="b" operator="arithmetic" k2="-1" k3="1" result="i"/>
    <feFlood flood-color="#000" flood-opacity="0.45"/><feComposite in2="i" operator="in" result="s"/>
    <feComposite in="s" in2="SourceGraphic" operator="over"/></filter>
  <filter id="sunk" x="-10%" y="-10%" width="120%" height="120%">
    <feOffset dy="2" in="SourceAlpha" result="o"/><feGaussianBlur in="o" stdDeviation="3" result="b"/>
    <feComposite in="SourceAlpha" in2="b" operator="arithmetic" k2="-1" k3="1" result="i"/>
    <feFlood flood-color="#000" flood-opacity="0.45"/><feComposite in2="i" operator="in" result="s"/>
    <feComposite in="s" in2="SourceGraphic" operator="over"/></filter>
  <filter id="glow" x="-100%" y="-300%" width="300%" height="700%"><feGaussianBlur stdDeviation="2.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
